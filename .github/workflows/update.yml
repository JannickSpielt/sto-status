name: Status und News aktualisieren

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 5 Minuten (GitHub kann sich ein paar Minuten verspäten)
  workflow_dispatch: {}      # manuell starten über den Actions-Tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Änderungen speichern
        run: |
          git config user.name "sto-status-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git push)
