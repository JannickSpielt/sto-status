name: Suchlauf (einmalig)
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: update-data, cancel-in-progress: false }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe.mjs
      - run: |
          git config user.name "sto-status-bot"; git config user.email "actions@users.noreply.github.com"
          git pull -q --rebase || true
          git add data/probe.json && git commit -m "Suchlauf" && git push
